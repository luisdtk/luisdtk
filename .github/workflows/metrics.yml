name: Pixel Metrics
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:      
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar card pixel-art
        run: node scripts/generate.mjs
        env:

          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --staged --quiet || (git commit -m "chore: update pixel metrics" && git push)
